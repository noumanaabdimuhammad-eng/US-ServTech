<style>
  :root {
    /* ---- Neutrals (deep blue ink, not black) ---- */
    --ink: #0a1c33; --ink-2: #0f2c50; --ink-3: #153a68;
    --bg: #f4f6f9; --card: #ffffff; --border: #dfe4ec; --border-soft: #edf1f6;
    --text: #16233a; --muted: #5c6b85;

    /* ---- Module accents: Operations = teal, Finance = blue ---- */
    --op-accent: #0d9488; --op-accent-dark: #0b7d73; --op-accent-bg: #e5f6f4;
    --fin-accent: #2563eb; --fin-accent-dark: #1d4fc7; --fin-accent-bg: #e7eefd;
    --accent: var(--op-accent); --accent-dark: var(--op-accent-dark); --accent-bg: var(--op-accent-bg);

    /* ---- Semantic ---- */
    --green: #0e7a4d; --green-bg: #dcf5e7;
    --amber: #92650a; --amber-bg: #fcefd1;
    --red: #b3261e; --red-bg: #fbe3e1;
    --slate: #475467; --slate-bg: #eef1f5;

    /* ---- Elevation & rhythm ---- */
    --shadow-xs: 0 1px 2px rgba(16,24,40,.05);
    --shadow-sm: 0 1px 3px rgba(16,24,40,.07), 0 1px 2px rgba(16,24,40,.05);
    --shadow-md: 0 4px 14px rgba(16,24,40,.08), 0 1px 3px rgba(16,24,40,.06);
    --shadow-lg: 0 18px 44px rgba(8,12,24,.16), 0 4px 12px rgba(8,12,24,.08);
    --radius: 12px; --radius-sm: 8px; --radius-lg: 16px;
  }
  [data-module="finance"] { --accent: var(--fin-accent); --accent-dark: var(--fin-accent-dark); --accent-bg: var(--fin-accent-bg); }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
  #app { min-height: 100vh; }
  h1, h2, h3, h4 { font-family: 'Inter Tight', 'Inter', -apple-system, sans-serif; }
  ::selection { background: var(--accent-bg); color: var(--ink); }
  a { color: var(--accent-dark); }

  /* ---- Login ---- */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: radial-gradient(1100px 700px at 18% 8%, #1e4a80 0%, var(--ink) 46%, #030c18 100%); }
  .login-card { background: var(--card); border: 1px solid rgba(255,255,255,.06); border-radius: var(--radius-lg); padding: 40px; width: 100%; max-width: 408px; box-shadow: var(--shadow-lg); }
  .login-card .login-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
  .login-card h1 { font-size: 20px; font-weight: 800; color: var(--ink); margin: 0; letter-spacing: -.015em; }
  .login-card p.sub { color: var(--muted); font-size: 13.5px; margin: 0 0 26px; line-height: 1.5; }
  .field { margin-bottom: 15px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; letter-spacing: .01em; }
  .field input, .field select, .field textarea { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; background: #fff; color: var(--text); transition: border-color .12s ease, box-shadow .12s ease; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3.5px var(--accent-bg); }
  .btn { display: inline-block; padding: 10px 18px; border-radius: var(--radius-sm); border: 1.5px solid transparent; font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap; transition: background-color .12s ease, border-color .12s ease, box-shadow .12s ease, transform .06s ease; }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: var(--shadow-xs); }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-ghost { background: #fff; color: var(--text); border-color: var(--border); }
  .btn-ghost:hover { background: var(--border-soft); border-color: #d3d8e1; }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-accent:hover { background: var(--accent-dark); }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-danger:hover { background: #93190f; }
