     off-screen document (so Arabic text gets real browser text-shaping),
     jsPDF drops that onto an A4 page, qrcode draws the ZATCA-style QR. -->

<style>
  :root {
    /* ---- Neutrals (deep blue ink, not black) ---- */
    --ink: #0a1c33; --ink-2: #0f2c50; --ink-3: #153a68;
    --bg: #f4f6f9; --card: #ffffff; --border: #dfe4ec; --border-soft: #edf1f6;
    --text: #16233a; --muted: #5c6b85;

    /* ---- Module accents: Operations = teal, Finance = blue ---- */
    --op-accent: #0d9488; --op-accent-dark: #0b7d73; --op-accent-bg: #e5f6f4;
    --fin-accent: #2563eb; --fin-accent-dark: #1d4fc7; --fin-accent-bg: #e7eefd;
    --accent: var(--op-accent); --accent-dark: var(--op-accent-dark); --accent-bg: var(--op-accent-bg);

    /* ---- Semantic ---- */
    --green: #0e7a4d; --green-bg: #dcf5e7;
    --amber: #92650a; --amber-bg: #fcefd1;
    --red: #b3261e; --red-bg: #fbe3e1;
    --slate: #475467; --slate-bg: #eef1f5;

    /* ---- Elevation & rhythm ---- */
    --shadow-xs: 0 1px 2px rgba(16,24,40,.05);
    --shadow-sm: 0 1px 3px rgba(16,24,40,.07), 0 1px 2px rgba(16,24,40,.05);
    --shadow-md: 0 4px 14px rgba(16,24,40,.08), 0 1px 3px rgba(16,24,40,.06);
    --shadow-lg: 0 18px 44px rgba(8,12,24,.16), 0 4px 12px rgba(8,12,24,.08);
    --radius: 12px; --radius-sm: 8px; --radius-lg: 16px;
  }
  [data-module="finance"] { --accent: var(--fin-accent); --accent-dark: var(--fin-accent-dark); --accent-bg: var(--fin-accent-bg); }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; }
  #app { min-height: 100vh; }
  h1, h2, h3, h4 { font-family: 'Inter Tight', 'Inter', -apple-system, sans-serif; }
  ::selection { background: var(--accent-bg); color: var(--ink); }
  a { color: var(--accent-dark); }

  /* ---- Login ---- */
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    background: linear-gradient(135deg, #0f2c58 0%, #1d4fc7 48%, #5b9bfb 100%); }
  .login-card { background: var(--card); border: 1px solid rgba(255,255,255,.06); border-radius: 22px; padding: 44px 40px 38px; width: 100%; max-width: 420px; box-shadow: 0 30px 64px rgba(9,26,64,.28), var(--shadow-lg); text-align: center; }
  .login-card .login-brand { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 18px; }
  .login-card h1 { font-size: 20px; font-weight: 800; color: var(--ink); margin: 0; letter-spacing: -.015em; }
  .login-card h1.welcome { font-size: 29px; margin: 4px 0 7px; letter-spacing: -.02em; }
  .login-card p.sub { color: var(--muted); font-size: 13.5px; margin: 0 0 28px; line-height: 1.5; text-align: center; }
  .login-card form { text-align: left; }
  .login-card .field input { background: #f2f4fa; border-color: #f2f4fa; padding: 12.5px 15px; border-radius: 12px; font-size: 14px; }
  .login-card .field input:focus { background: #fff; border-color: var(--fin-accent); box-shadow: 0 0 0 3.5px var(--fin-accent-bg); }
  .login-card .field label { font-size: 12.5px; font-weight: 700; color: var(--text); margin-bottom: 7px; }
  .pw-field-wrap { position: relative; }
  .pw-field-wrap input { padding-right: 44px !important; }
  .pw-toggle { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--muted); padding: 6px; display: flex; border-radius: 8px; }
  .pw-toggle:hover { color: var(--text); background: rgba(16,24,40,.05); }
  .login-remember { display: flex; align-items: center; gap: 9px; margin: 2px 0 22px; }
  .login-remember input[type="checkbox"] { width: 17px; height: 17px; accent-color: var(--fin-accent); cursor: pointer; margin: 0; }
  .login-remember label { font-size: 13.5px; font-weight: 500; color: var(--text); cursor: pointer; margin: 0; }
  .login-card .btn-primary { padding: 13px 18px; border-radius: 12px; font-size: 14.5px; background: linear-gradient(135deg, var(--fin-accent) 0%, var(--fin-accent-dark) 100%); }
  .login-card .btn-primary:hover { background: linear-gradient(135deg, var(--fin-accent-dark) 0%, #163ea3 100%); }
  .login-card .error-msg { text-align: center; }
  .field { margin-bottom: 15px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 5px; letter-spacing: .01em; }
  .field input, .field select, .field textarea { width: 100%; padding: 10px 12px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 14px; font-family: inherit; background: #fff; color: var(--text); transition: border-color .12s ease, box-shadow .12s ease; }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3.5px var(--accent-bg); }
  .btn { display: inline-block; padding: 10px 18px; border-radius: var(--radius-sm); border: 1.5px solid transparent; font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap; transition: background-color .12s ease, border-color .12s ease, box-shadow .12s ease, transform .06s ease; }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: var(--shadow-xs); }
  .btn-primary:hover { background: var(--accent-dark); }
  .btn-ghost { background: #fff; color: var(--text); border-color: var(--border); }
  .btn-ghost:hover { background: var(--border-soft); border-color: #d3d8e1; }
  .btn-accent { background: var(--accent); color: #fff; }
  .btn-accent:hover { background: var(--accent-dark); }
  .btn-danger { background: var(--red); color: #fff; }
  .btn-danger:hover { background: #93190f; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: default; }
  .error-msg { color: var(--red); font-size: 13px; margin-top: 10px; min-height: 18px; }

  /* ---- Logo mark (US ServTech company logo) ---- */
  .logo-badge { height: 30px; width: auto; flex: 0 0 auto; display: block; }
  .login-card .logo-badge { height: 76px; margin: 0 auto; }

  /* ---- Shell: a fixed dark sidebar (identity + module switch only — the
     screens within a module live in the light top subnav bar, .topbar
     below) beside the content ---- */
  .shell { display: flex; min-height: 100vh; }
  .sidebar { width: 258px; flex: 0 0 258px; background: linear-gradient(190deg, var(--ink-2) 0%, var(--ink) 62%, #061020 100%);
    color: #fff; display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow-y: auto; overflow-x: hidden;
    box-shadow: 2px 0 18px rgba(4,10,22,.18); z-index: 20; transition: width .16s ease, flex-basis .16s ease; }
  .sidebar-collapse-toggle { position: absolute; top: 20px; right: -13px; width: 26px; height: 26px; border-radius: 50%;
    background: var(--card); border: 1.5px solid var(--border); color: var(--ink); display: flex; align-items: center; justify-content: center;
    cursor: pointer; box-shadow: var(--shadow-sm); z-index: 25; font-size: 13px; line-height: 1; padding: 0; }
  .sidebar-collapse-toggle:hover { background: var(--border-soft); }
  .sidebar-brand { display: flex; align-items: center; gap: 11px; padding: 22px 20px 18px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .sidebar-title { font-family: 'Inter Tight', 'Inter', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; }
  .sidebar-tag { font-weight: 400; color: rgba(255,255,255,.46); font-size: 10.5px; letter-spacing: .03em; margin-top: 1px; white-space: nowrap; }
  .brand-text { min-width: 0; overflow: hidden; }

  .sidebar-profile { display: flex; align-items: center; gap: 11px; padding: 16px 20px; border-bottom: 1px solid rgba(255,255,255,.08); }
  .avatar { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, var(--op-accent), var(--fin-accent)); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex: 0 0 auto; letter-spacing: -.02em; }
  .avatar-sm { width: 30px; height: 30px; font-size: 11.5px; }
  .who-text { min-width: 0; overflow: hidden; }
  .who-name { font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who-role { font-size: 11px; color: rgba(255,255,255,.6); display: flex; align-items: center; gap: 6px; margin-top: 2px; white-space: nowrap; }
  .status-dot { width: 7px; height: 7px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 0 2.5px rgba(34,197,94,.22); flex: 0 0 auto; }

  .sidebar-modules { display: flex; flex-direction: column; gap: 4px; padding: 14px 14px 6px; }
  .sidebar-modules button { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.07); color: rgba(255,255,255,.72);
    padding: 8px 12px; border-radius: 9px; cursor: pointer; font-size: 12.5px; font-weight: 600; letter-spacing: .01em; text-align: left; transition: background-color .12s ease, color .12s ease, border-color .12s ease; }
  .sidebar-modules button .mod-icon { width: 21px; height: 21px; border-radius: 7px; background: rgba(255,255,255,.12); display: flex; align-items: center;
    justify-content: center; font-size: 10.5px; font-weight: 800; flex: 0 0 auto; }
  .sidebar-modules button:hover { background: rgba(255,255,255,.09); color: #fff; }
  .sidebar-modules button.active.mod-operations { background: var(--op-accent); border-color: var(--op-accent); color: #fff; }
  .sidebar-modules button.active.mod-finance { background: var(--fin-accent); border-color: var(--fin-accent); color: #fff; }
  .sidebar-modules button.active .mod-icon { background: rgba(255,255,255,.22); }
  .sidebar-label { white-space: nowrap; }

  .sidebar-signout { margin: 10px 14px 18px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.1); color: #fff;
    padding: 9px 12px; border-radius: 9px; cursor: pointer; font-size: 12.5px; font-weight: 600; text-align: left; display: flex; align-items: center; gap: 10px; }
  .sidebar-signout:hover { background: rgba(255,255,255,.13); }
  .signout-icon { flex: 0 0 auto; font-size: 13px; width: 21px; text-align: center; }

  .sidebar-backdrop { display: none; }

  /* ---- Collapsed sidebar: icons/avatar only, no text ---- */
  .shell.sidebar-collapsed .sidebar { width: 76px; flex-basis: 76px; }
  .shell.sidebar-collapsed .sidebar-brand { justify-content: center; padding-left: 8px; padding-right: 8px; }
  .shell.sidebar-collapsed .brand-text,
  .shell.sidebar-collapsed .who-text,
  .shell.sidebar-collapsed .sidebar-label { display: none; }
  .shell.sidebar-collapsed .sidebar-profile { justify-content: center; padding-left: 8px; padding-right: 8px; }
  .shell.sidebar-collapsed .sidebar-modules { padding-left: 10px; padding-right: 10px; }
  .shell.sidebar-collapsed .sidebar-modules button { justify-content: center; padding: 9px; }
  .shell.sidebar-collapsed .sidebar-signout { justify-content: center; padding: 9px; margin-left: 10px; margin-right: 10px; }
  .shell.sidebar-collapsed .sidebar-collapse-toggle { transform: scaleX(-1); }

  .main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .topbar-mobile { display: none; }

  /* ---- Top subnav bar: every screen within the active module (Operations /
     Finance), grouped for Finance — replaces the old in-sidebar nav list. ---- */
  .topbar { background: var(--card); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .topbar-inner { max-width: 1180px; margin: 0 auto; padding: 12px 24px 0; }
  /* No overflow-hidden here on purpose — the grouped Finance items' dropdown
     menus (.subnav-dropdown-menu below) are absolutely positioned inside
     this row, and any ancestor with overflow-y:hidden/auto would clip them
     invisible the moment they open. Long rows wrap instead of scrolling. */
  .subnav-scroll { padding-bottom: 10px; }
  .subnav { display: flex; align-items: center; gap: 4px 8px; flex-wrap: wrap; }
  .subnav-group { display: flex; align-items: center; gap: 3px; padding-right: 10px; margin-right: 8px; border-right: 1px solid var(--border-soft); }
  .subnav-group:last-child { border-right: none; margin-right: 0; padding-right: 0; }
  .subnav-group-label { font-size: 9.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-right: 5px; flex: 0 0 auto; }
  .subnav-item { background: none; border: 1px solid transparent; color: var(--muted); padding: 7px 13px; border-radius: 99px; cursor: pointer;
    font-size: 12.5px; font-weight: 600; white-space: nowrap; flex: 0 0 auto; transition: background-color .12s ease, color .12s ease, border-color .12s ease; }
  .subnav-item:hover { background: var(--accent-bg); color: var(--accent-dark); }
  .subnav-item.active { background: var(--accent); color: #fff; box-shadow: var(--shadow-xs); }

  /* Finance's grouped screens (Accounting, Invoices & Expenses, Reports, …)
     are a hover dropdown off the group name, not an always-open row of
     buttons — hover/focus opens it on desktop; tapping the trigger toggles
     the .open class for touch devices. */
  .subnav-dropdown { position: relative; flex: 0 0 auto; }
  .subnav-dropdown-trigger { display: inline-flex; align-items: center; gap: 4px; background: none; border: 1px solid transparent; color: var(--muted);
    padding: 7px 12px; border-radius: 99px; cursor: pointer; font-size: 12.5px; font-weight: 600; white-space: nowrap; font-family: inherit;
    transition: background-color .12s ease, color .12s ease; }
  .subnav-dropdown-trigger .chev { font-size: 8px; opacity: .55; transition: transform .14s ease; }
  .subnav-dropdown-trigger:hover { background: var(--accent-bg); color: var(--accent-dark); }
  .subnav-dropdown-trigger.active { background: var(--accent); color: #fff; }
  .subnav-dropdown-trigger.active .chev { opacity: .9; }
  .subnav-dropdown-menu { position: absolute; top: 100%; left: 0; padding-top: 8px; display: none; z-index: 30; }
  .subnav-dropdown:hover .subnav-dropdown-menu,
  .subnav-dropdown:focus-within .subnav-dropdown-menu,
  .subnav-dropdown.open .subnav-dropdown-menu { display: block; }
  .subnav-dropdown:hover .subnav-dropdown-trigger .chev,
  .subnav-dropdown.open .subnav-dropdown-trigger .chev { transform: rotate(180deg); }
  .subnav-dropdown-menu-inner { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-md);
    padding: 6px; min-width: 200px; display: flex; flex-direction: column; gap: 1px; }
  .subnav-dropdown-item { display: block; width: 100%; text-align: left; background: none; border: none; color: var(--text); padding: 8.5px 11px;
    border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 500; font-family: inherit; white-space: nowrap; }
  .subnav-dropdown-item:hover { background: var(--accent-bg); color: var(--accent-dark); }
  .subnav-dropdown-item.active { background: var(--accent); color: #fff; font-weight: 600; }

  main { max-width: 1180px; width: 100%; margin: 0 auto; padding: 24px 24px 64px; }

  /* ---- Narrow screens: sidebar becomes an off-canvas panel (always full
     width/expanded there — the collapse feature is desktop-only) ---- */
  @media (max-width: 860px) {
    .sidebar { position: fixed; left: 0; top: 0; transform: translateX(-100%); transition: transform .18s ease; width: 264px; flex-basis: 264px; }
    .shell.sidebar-open .sidebar { transform: translateX(0); }
    .shell.sidebar-open .sidebar-backdrop { display: block; position: fixed; inset: 0; background: rgba(6,12,24,.5); z-index: 19; }
    .shell.sidebar-collapsed .sidebar { width: 264px; flex-basis: 264px; }
    .shell.sidebar-collapsed .brand-text, .shell.sidebar-collapsed .who-text, .shell.sidebar-collapsed .sidebar-label { display: block; }
    .shell.sidebar-collapsed .sidebar-modules button, .shell.sidebar-collapsed .sidebar-signout { justify-content: flex-start; }
    .sidebar-collapse-toggle { display: none; }
    .topbar-mobile { display: flex; align-items: center; gap: 12px; background: var(--ink); color: #fff; height: 54px; padding: 0 16px;
      position: sticky; top: 0; z-index: 15; border-bottom: 1px solid rgba(255,255,255,.08); }
    .hamburger { background: none; border: none; color: #fff; font-size: 19px; cursor: pointer; padding: 4px 6px; line-height: 1; }
    .topbar-crumb { font-size: 12.5px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .topbar { top: 54px; }
    .topbar-inner { padding: 10px 16px 0; }
    main { padding: 20px 16px 48px; }
  }
  h2.page-title { font-size: 21px; font-weight: 800; color: var(--ink); margin: 0 0 5px; letter-spacing: -.015em; }
  p.page-sub { color: var(--muted); font-size: 13.5px; line-height: 1.5; margin: 0 0 22px; max-width: 760px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 18px; box-shadow: var(--shadow-xs); }
  .card h3 { font-size: 14.5px; font-weight: 700; margin: 0 0 13px; color: var(--ink); }
  .card h4 { font-size: 12.5px; font-weight: 700; margin: 0 0 9px; color: var(--ink); text-transform: uppercase; letter-spacing: .04em; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 9px 11px; border-bottom: 1.5px solid var(--border); background: #fafbfc; }
  th:first-child { border-top-left-radius: 8px; } th:last-child { border-top-right-radius: 8px; }
  td { padding: 10px 11px; border-bottom: 1px solid var(--border-soft); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tbody tr:hover td { background: #fafbfd; }
  tr.clickable { cursor: pointer; }
  tr.clickable:hover td { background: var(--accent-bg); }
  tr.total-row td { border-top: 2px solid var(--ink); font-weight: 700; color: var(--ink); background: transparent; }
  tr.subtotal-row td { border-top: 1px solid var(--border); font-weight: 600; background: transparent; }
  td.indent { padding-left: 24px; }

  /* Editable line-item tables (New inquiry's "Services required" grid and
     similar) — gives the service picker/description/price/discount cells a
     fixed, presentable column layout with properly styled controls, instead
     of unstyled inputs sized by browser defaults. */
  table.items-table { table-layout: fixed; }
  table.items-table th:nth-child(1), table.items-table td:nth-child(1) { width: 17%; }
  table.items-table th:nth-child(2), table.items-table td:nth-child(2) { width: 41%; }
  table.items-table th:nth-child(3), table.items-table td:nth-child(3) { width: 15%; }
  table.items-table th:nth-child(4), table.items-table td:nth-child(4) { width: 15%; }
  table.items-table th:nth-child(5), table.items-table td:nth-child(5) { width: 12%; }
  table.items-table td { vertical-align: middle; padding: 7px 8px; }
  table.items-table select, table.items-table input { width: 100%; padding: 8px 10px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    font-size: 13px; font-family: inherit; background: #fff; color: var(--text); box-sizing: border-box; transition: border-color .12s ease, box-shadow .12s ease; }
  table.items-table select:focus, table.items-table input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
  table.items-table input[type="number"] { text-align: right; }

  /* Any other bare select/input sitting directly in a plain table cell —
     payment-method pickers (pay/pick-bank dropdowns on Invoices, Expenses,
     Payroll, Asset Register), task/status pickers, and any future one like
     them — get the same presentable styling as items-table's controls,
     instead of unstyled browser-default chrome. Scoped to a direct <td>
     child so wrapped .field controls and the dedicated coa-edit-row style
     (which already has its own rule) are left alone. */
  table:not(.items-table) tr:not(.coa-edit-row) > td > select,
  table:not(.items-table) tr:not(.coa-edit-row) > td > input:not([type="checkbox"]):not([type="radio"]) {
    padding: 7px 10px; border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    font-size: 13px; font-family: inherit; background: #fff; color: var(--text);
    box-sizing: border-box; max-width: 220px; transition: border-color .12s ease, box-shadow .12s ease;
  }
  table:not(.items-table) tr:not(.coa-edit-row) > td > select:focus,
  table:not(.items-table) tr:not(.coa-edit-row) > td > input:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg);
  }

  .pill { display: inline-flex; align-items: center; padding: 3px 10px; border-radius: 99px; font-size: 10.5px; font-weight: 700; letter-spacing: .01em; }
  .pill-delivered { background: var(--green-bg); color: var(--green); }
  .pill-completed { background: var(--amber-bg); color: var(--amber); }
  .pill-process { background: var(--slate-bg); color: var(--slate); }
  .pill-cancelled { background: var(--red-bg); color: var(--red); }
  .pill-paid { background: var(--green-bg); color: var(--green); }
  .pill-unpaid { background: var(--amber-bg); color: var(--amber); }
  .pill-pending { background: var(--slate-bg); color: var(--slate); }
  .pill-accepted { background: var(--green-bg); color: var(--green); }
  .pill-rejected { background: var(--red-bg); color: var(--red); }
  .pill-open { background: var(--fin-accent-bg); color: var(--fin-accent-dark); }
  .pill-closed { background: var(--slate-bg); color: var(--slate); }

  /* Gradient-header stat tiles — a colored band names the metric, the
     number sits in a plain white body below it. */
  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .kpi { position: relative; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 0; box-shadow: var(--shadow-xs); overflow: hidden;
    display: flex; flex-direction: column; transition: box-shadow .14s ease, transform .1s ease; }
  .kpi .label { font-size: 10.5px; font-weight: 700; color: #fff; margin: 0; padding: 11px 16px; text-transform: uppercase; letter-spacing: .05em;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%); }
  .kpi .value { font-size: 25px; font-weight: 800; color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: -.01em; padding: 15px 18px 6px; }
  .kpi.accent .label { background: linear-gradient(135deg, var(--accent-dark) 0%, var(--ink-2) 100%); }
  .kpi.negative .label { background: linear-gradient(135deg, var(--red) 0%, #7a1610 100%); }

  .form-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
  .form-row .field { flex: 1; min-width: 140px; margin-bottom: 0; }
  .task-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
  .task-row input[type=text] { flex: 2; } .task-row input[type=number] { flex: 1; max-width: 100px; }
  .subtle { color: var(--muted); font-size: 12px; }
  .right { text-align: right; }
  .totals-line { font-size: 13px; margin-top: 10px; }
  .totals-line b { color: var(--ink); }
  .empty-state { color: var(--muted); font-size: 13px; padding: 26px; text-align: center; }
  .wo-detail { background: var(--bg); border: 1px solid var(--border-soft); border-radius: var(--radius-sm); padding: 14px; margin-top: 6px; }
  .toast { position: fixed; bottom: 22px; right: 22px; background: var(--ink); color: #fff; padding: 11px 18px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; z-index: 100; box-shadow: var(--shadow-lg); }
  .toast.error { background: var(--red); }
  .link-btn { background: none; border: none; color: var(--accent-dark); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font-size: 12px; font-weight: 500; padding: 0; font-family: inherit; }
  .link-btn.danger { color: var(--red); }
  tr.coa-edit-row td { background: var(--accent-bg); vertical-align: middle; }
  tr.coa-edit-row input, tr.coa-edit-row select { padding: 6px 8px; border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: inherit; background: #fff; color: var(--text); }

  /* ---- Finance-specific ---- */
  .statement-meta { display: flex; gap: 16px; align-items: flex-end; margin-bottom: 18px; flex-wrap: wrap; }
  .statement-head { text-align: center; margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border-soft); }
  .statement-head .co { font-weight: 800; color: var(--ink); font-size: 15.5px; letter-spacing: -.01em; }
  .statement-head .title { font-weight: 700; color: var(--fin-accent-dark); font-size: 13px; margin-top: 3px; }
  .statement-head .period { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .balance-flag { font-size: 11.5px; padding: 4px 11px; border-radius: 99px; font-weight: 700; }
  .balance-flag.ok { background: var(--green-bg); color: var(--green); }
  .balance-flag.bad { background: var(--red-bg); color: var(--red); }

  /* ---- Finance Dashboard ---- */
  .kpi .hint { font-size: 11px; color: var(--muted); padding: 0 18px 15px; margin: -4px 0 0; }
  .kpi.negative .value { color: var(--red); }
  .kpi.clickable { cursor: pointer; transition: box-shadow .12s ease, transform .1s ease; user-select: none; }
  .kpi.clickable:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }
  .kpi.selected { box-shadow: 0 0 0 2px var(--kpi-color, var(--accent)) inset, var(--shadow-sm); }
  .kpi.selected .label { background: linear-gradient(135deg, var(--kpi-color, var(--accent)) 0%, var(--ink-2) 100%); }
  .trend-legend button.leg-item { display: inline-flex; align-items: center; gap: 6px; background: none; border: none; cursor: pointer; font: inherit; font-size: 12px; color: var(--muted); padding: 3px 0; opacity: .55; }
  .trend-legend button.leg-item.active { opacity: 1; color: var(--text); font-weight: 600; }
